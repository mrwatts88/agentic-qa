# Paths that hold key-shaped strings on purpose. GitHub secret scanning reads
# this file; it does not affect agentic-qa, whose own gitleaks run excludes the
# same places through gitleaks' allowlist, the corpus rule's excludePaths and
# qa.config.yaml's ignore list.
paths-ignore:
  # gitleaks' upstream ruleset, vendored: its allowlists contain public Google
  # and Firebase keys precisely so they are not reported.
  - "config/gitleaks.toml"
  # Fabricated keys that prove the scanner catches the shapes it should.
  - "fixtures/**"
  - "test/**"
