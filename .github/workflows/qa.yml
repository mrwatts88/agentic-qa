# The third call site: the one nobody can skip with --no-verify.
#
# The git hook runs the free mechanical tier so commits stay fast and offline.
# Everything that costs money or needs the network runs here instead.
name: qa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Declared at job level on purpose. A step's own `env` is not in scope when
    # its `if` is evaluated, so gating on it there would leave the judgment
    # steps permanently skipped while looking perfectly correct.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The contract checker compares against committed verdicts, and the
          # hook needs history to tell what actually changed.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Install from the lockfile, not from the manifest: no lockfile means a
      # different dependency tree on every build.
      - run: npm ci

      - run: npm run build

      # The scanners npm cannot install (opengrep, gitleaks) and the community
      # rules opengrep runs, each pinned in src/tools/provision.ts. Every check
      # would download them on first use anyway; doing it here keeps that out
      # of the test run, which never downloads, and the cache keeps it out of
      # every run after the first. Without them the rules step fails closed,
      # as it should: in CI a missing scanner is a problem with the repo.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agentic-qa
          key: agentic-qa-tools-${{ runner.os }}-${{ hashFiles('src/tools/provision.ts') }}

      - run: node dist/cli.js setup

      - run: npm test

      # This repo only: score the scanner and pattern rules against fixtures
      # whose answers are known. Free and deterministic, so it runs on every
      # push; the judgment scoring costs money and runs by hand.
      - run: npm run eval:rules

      # The ci row of the call-site table: every scanner, then the judgment rules
      # and test contracts. Those call a model, which locally rides on Claude
      # Code's OAuth and here needs the key; without it they are skipped with a
      # warning rather than failed, so a fork's pull request still gets the free
      # tier.
      - name: agentic-qa ci
        run: node dist/cli.js ci
