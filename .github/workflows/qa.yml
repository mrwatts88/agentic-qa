# The third call site: the one nobody can skip with --no-verify.
#
# The git hook runs the free mechanical tier so commits stay fast and offline.
# Everything that costs money or needs the network runs here instead.
name: qa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Declared at job level on purpose. A step's own `env` is not in scope when
    # its `if` is evaluated, so gating on it there would leave the judgment
    # steps permanently skipped while looking perfectly correct.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The contract checker compares against committed verdicts, and the
          # hook needs history to tell what actually changed.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Install from the lockfile, not from the manifest: no lockfile means a
      # different dependency tree on every build.
      - run: npm ci

      # gitleaks is a Go binary, not an npm package, so npm ci does not bring it.
      # Pinned to the version its vendored ruleset in config/gitleaks.toml came
      # from. Without it the rules step fails closed here, as it should: in CI a
      # missing scanner is a problem with the repo, not with somebody's laptop.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - run: npm run build

      - run: npm test

      # Free, deterministic, and the same binary the pre-commit hook runs.
      - name: Rules, mechanical tier
        run: node dist/cli.js rules

      # The judgment tiers call a model. Locally that rides on Claude Code's
      # OAuth, which CI does not have, so a key is required here. Both steps are
      # skipped rather than failed when the secret is absent, so a fork's pull
      # request still gets the free tier.
      - name: Rules, judgment tier
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: node dist/cli.js rules --llm

      - name: Test contracts
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: node dist/cli.js contracts
