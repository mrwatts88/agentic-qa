# agentic-qa checking itself.
#
# The tool's own test suite is the first real corpus it runs against. Every
# other result so far comes from fixtures written to have known answers, which
# proves the machinery works but says nothing about how it behaves on code that
# was not built to be a test case.
#
# fixtures/ is excluded deliberately: those suites are broken on purpose and
# judging them as if they were ours would be meaningless noise.

testGlobs:
  - "test/**/*.test.ts"

ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.qa/**"
  - "fixtures/**"

judge:
  model: haiku
  concurrency: 4
  maxBudgetUsd: 0.5

# Left off while the suite is being brought up to standard. Turning it on is
# the ratchet: once every description is falsifiable, it should stay that way.
failOnUnverifiable: false

# What runs at each call site; defaults and reasoning in src/sites.ts. Stop runs
# the free tier only here: a model call on every turn of every session spent
# working on the tool itself is real money for no benefit. Consuming repos keep
# the default, judgment tiers at Stop included.
callSites:
  stop:
    llm: false
    contracts: false

rules:
  llm:
    maxFileBytes: 60000
