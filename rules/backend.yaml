pack: backend
rules:
  - id: be.layer.no-db-client-outside-repository
    statement: Import the database client only inside the repository layer.
    tier: mechanical
    severity: error
    rationale: >
      Layer boundaries only exist if something enforces them. Once a handler
      queries the database directly, business rules and SQL interleave, and the
      repository layer stops being the place where data access is understood.
    source: full-stack-swe/02-backend-architecture.md
    triggers:
      paths:
        - "**/*.ts"
      excludePaths:
        - "**/repositories/**"
        - "**/repository/**"
        - "**/migrations/**"
        # The module that constructs the pool is the database client, not a
        # consumer of it, and every project has one. Kept to the conventional
        # filenames so that query logic in, say, db/queries.ts is still caught.
        - "**/db/{client,index,pool}.{ts,js}"
        - "**/database/{client,index,pool}.{ts,js}"
        - "**/*.{test,spec}.{ts,tsx}"
    # Delegated: the cruiser resolves the module graph, so it sees require(),
    # dynamic import(), re-exports and the repo's own db/client module. The
    # pattern it replaced matched only an import statement naming a package,
    # and missed four of the six violations in a probe shaped like orders-admin.
    # The cruiser config mirrors excludePaths above.
    enforcement:
      kind: external
      tool: dependency-cruiser
      rule: no-db-client-outside-repository

  - id: be.validation.no-unvalidated-request-body
    statement: Validate a request body before using it.
    tier: mechanical
    severity: error
    rationale: >
      A request body is attacker-controlled input. Reading it straight into
      business logic trusts whatever arrived over the wire. Parse it through a
      schema so the shape is checked once, at the edge.
    source: full-stack-swe/05-auth-and-security.md
    triggers:
      paths:
        - "**/*.ts"
      excludePaths:
        - "**/*.{test,spec}.{ts,tsx}"
    enforcement:
      kind: pattern
      pattern: |-
        await\s+c\.req\.json\(\)
      # Hono's zod validator, or any local parse, satisfies the rule.
      unlessFilePattern: |-
        (zValidator|\.parse\(|\.safeParse\(|validator\()

  - id: be.authz.ownership-check
    statement: >
      An endpoint that loads a record by id must check the caller is allowed
      that record, not merely that they are logged in.
    tier: llm
    severity: error
    rationale: >
      Agents reliably implement authentication and forget authorisation. The
      result looks correct and passes tests, while any logged-in user can read
      any other user's data by changing an id in the URL.
    source: full-stack-swe/05-auth-and-security.md
    triggers:
      paths:
        - "**/*.ts"
      excludePaths:
        - "**/*.{test,spec}.{ts,tsx}"
    enforcement:
      kind: llm
      prompt: >
        This rule is about request handlers. It applies only to code that reads
        an identifier out of an incoming request, such as a route parameter, a
        query string or a body, and then loads, updates or deletes a record with
        it. If the file has no request handling in it, answer not-applicable,
        however many identifiers its functions take: a service or repository
        function receiving an id from its caller is not the place this check
        belongs, and flagging those would condemn almost every function in a
        codebase.
        Where the rule does apply, ask whether the handler verifies that the
        authenticated caller is entitled to that specific record, rather than
        only that someone is logged in. Answer violated if any authenticated
        user could reach another user's record by changing the identifier,
        whether they read it, change it or delete it. A query scoped to the
        caller's account is a valid check and counts as ok.

  - id: be.errors.no-silent-fallback
    statement: Do not turn a failure into a plausible-looking success.
    tier: llm
    severity: error
    rationale: >
      A catch block that returns an empty list or a default object converts an
      outage into silently missing data. Nothing alerts, the UI looks fine, and
      the bug surfaces days later as a data problem.
    source: full-stack-swe/12-engineering-in-the-ai-era.md
    triggers:
      paths:
        - "**/*.ts"
      excludePaths:
        - "**/*.{test,spec}.{ts,tsx}"
    enforcement:
      kind: llm
      prompt: >
        Does this catch block swallow a failure and return something that the
        caller cannot distinguish from a successful result? Answer violated only
        when the caller genuinely cannot tell, not when the fallback is an
        explicit, documented product decision.
